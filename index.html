<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frase do Dia</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .frase-slider {
      width: 100%;
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      background: transparent;

      font-family: Arial, Helvetica, sans-serif;
    }

    #frase {
      margin: 0;
      padding: 0 20px;

      font-size: 22px;
      font-weight: 400;
      color: #111111;

      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    }

    #frase.saindo {
      opacity: 0;
      transform: translateY(-10px);
    }

    #frase.entrando {
      opacity: 0;
      transform: translateY(10px);
    }

  </style>
</head>

<body>

  <div class="frase-slider">
    <div id="frase">
      Carregando...
    </div>
  </div>

  <script>

    let frases = [];
    let indiceAtual = -1;

    async function carregarFrases() {

      try {

        const resposta = await fetch("frases.txt");

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar frases.txt");
        }

        const texto = await resposta.text();

        frases = texto
          .split(/\r?\n/)
          .map(frase => frase.trim())
          .filter(frase => frase.length > 0);

        if (frases.length === 0) {
          throw new Error("Nenhuma frase encontrada.");
        }

        trocarFrase();

        // Troca a frase a cada 30 segundos
        setInterval(trocarFrase, 15000);

      } catch (erro) {

        console.error(erro);

        document.getElementById("frase").textContent =
          "O Go Live está chegando. Finjam naturalidade.";

      }

    }


    function escolherNovaFrase() {

      // Evita mostrar a mesma frase duas vezes seguidas

      let novoIndice;

      do {

        novoIndice = Math.floor(
          Math.random() * frases.length
        );

      } while (
        novoIndice === indiceAtual &&
        frases.length > 1
      );

      indiceAtual = novoIndice;

      return frases[indiceAtual];

    }


    function trocarFrase() {

      const elemento = document.getElementById("frase");

      // Frase atual sobe e desaparece

      elemento.classList.add("saindo");

      setTimeout(() => {

        const novaFrase = escolherNovaFrase();

        elemento.textContent =
          `"${novaFrase}"`;

        elemento.classList.remove("saindo");

        elemento.classList.add("entrando");

        // Força o navegador a registrar a posição inicial
        void elemento.offsetWidth;

        elemento.classList.remove("entrando");

      }, 600);

    }


    carregarFrases();

  </script>

</body>
</html>
